{% extends 'base.html' %}
{% block title %}Password Reset - SAMS{% endblock %}
{% block content %}
<div class="login-wrapper"><div class="login-card">
<h2>Reset Password</h2><p class="muted">Enter the email linked to your account.</p>
<form method="post">{% csrf_token %}{{ form.email }}<button class="btn primary full" type="submit">Send Reset Link</button></form>
<p class="muted small">For this local project, the reset email is printed in the terminal.</p>
</div></div>
{% endblock %}
