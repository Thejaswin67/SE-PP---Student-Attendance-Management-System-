{% extends 'base.html' %}{% block title %}Departments - SAMS{% endblock %}{% block content %}<div class="page-heading"><h1>Departments</h1><a class="btn primary" href="{% url 'department_add' %}">Add Department</a></div><div class="card table-wrapper"><table><thead><tr><th>Name</th><th>Code</th><th>Action</th></tr></thead><tbody>{% for department in departments %}<tr><td>{{ department.name }}</td><td>{{ department.code }}</td><td><form method="post" action="{% url 'department_delete' department.id %}" class="inline-form">{% csrf_token %}<button class="btn delete" onclick="return confirm('Delete this department?')">Delete</button></form></td></tr>{% empty %}<tr><td colspan="3">No departments.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
